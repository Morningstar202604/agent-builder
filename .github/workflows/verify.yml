name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Skill verification gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification gate
        run: npm run check